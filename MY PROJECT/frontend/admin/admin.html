<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        :root { --ios-bg: #F2F2F7; --ios-card: #FFFFFF; --ios-blue: #007AFF; --ios-green: #34C759; --ios-gray: #8E8E93; --ios-border: #C6C6C8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--ios-bg); color: #000; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .container { width: 100%; max-width: 480px; background: var(--ios-card); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px; margin-top: 30px; }
        h1, h2 { font-weight: 600; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; background: #E5E5EA; padding: 4px; border-radius: 10px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .tab.active { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); color: #000; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: var(--ios-gray); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--ios-border); border-radius: 10px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 14px; background: var(--ios-blue); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .btn:active { opacity: 0.85; }
        .view { display: none; } .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .data-card { background: #F5F5F7; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #E5E5EA; }
        .row:last-child { border: none; }
        .copy-btn { background: #E5E5EA; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #000; }
        .copy-btn.copied { background: var(--ios-green); color: #fff; }
        .empty { text-align: center; color: var(--ios-gray); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="admin-login" class="view active">
            <h1 style="text-align:center;">Admin Access</h1>
            <div class="input-group"><label>Username</label><input type="text" id="a-user" placeholder="admin"></div>
            <div class="input-group"><label>Password</label><input type="password" id="a-pass" placeholder="admin123"></div>
            <button class="btn" onclick="handleAdminLogin()">Enter Dashboard</button>
        </div>

        <div id="admin-dash" class="view">
            <h2>Admin Panel</h2>
            <div class="tabs">
                <div class="tab active" onclick="setTab('logins', this)">🔑 Login Data</div>
                <div class="tab" onclick="setTab('requests', this)">📄 Requests</div>
            </div>

            <div id="logins-view" class="tab-content"></div>
            <div id="requests-view" class="tab-content" style="display:none;"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
